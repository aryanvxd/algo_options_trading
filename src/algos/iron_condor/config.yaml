# NIFTY weekly short iron condor — every tunable number lives here.
# Times are IST and must be quoted ("09:20").

algo_id: iron_condor
name: NIFTY Short Iron Condor
version: "0.1.0"
description: Sell OTM CE+PE, buy further-OTM hedges; expiry day and the 2 trading days before it.
mode: paper            # live is disabled in v1
lots: 1

underlying: NIFTY
index_symbol: "NIFTY 50"
vix_symbol: "INDIA VIX"
universe: nifty50      # config/universes/nifty50.yaml (pre-open breadth)
strike_step: 50
trade_window_days: 3   # expiry day + 2 trading days before (normally Fri, Mon, Tue)

# Gap between the two shorts, centred on ATM, keyed by trading days to expiry.
width_by_dte: {0: 500, 1: 550, 2: 600}
# Distance from each short to its hedge.
hedge_by_dte: {0: 200, 1: 250, 2: 300}
subscribe_buffer_pts: 200   # extra strikes subscribed beyond the hedges, in case spot moves before entry

filters:
  vix_max: 20
  gap_filter: true
  max_gap_pct: 0.8
  breadth_filter: true
  adv_dec_extreme_ratio: 0.9   # 45 of 50 moving the same way

entry:
  max_spread_pts: 2.0          # reject a leg whose bid-ask is wider than this
  min_credit_pts: 10           # not worth the risk + charges below this

exits:
  # Stop/target trigger on GROSS P&L (premium movement at bid/ask, before charges); net P&L after
  # charges is still logged in snapshots, live state and the daily summary.
  # With 1 lot, a net-of-charges ₹300 stop fires the moment the trade opens (~₹190 charges + spread).
  pnl_basis: gross             # gross | net (net = after entry charges + estimated exit charges)
  stop_loss_points: 5          # points of premium × lot size × lots (5 × 65 = ₹325 for 1 lot)
  target_points: 8             # 8 × 65 = ₹520 for 1 lot
  stop_loss_rupees: 300        # used only when stop_loss_points is null
  target_rupees: 500           # used only when target_points is null
  premium_blowout_mult: 1.35   # exit if cost to close >= 1.35 × entry credit
  short_leg_mult: 2.0          # ... or any short leg doubles
  stale_feed_seconds: 10

schedule:
  day_check: "08:15"
  premarket: "09:08"
  start_feed: "09:15"
  entry: "09:20"
  entry_deadline: "09:35"
  square_off: "15:15"
  report: "15:35"
