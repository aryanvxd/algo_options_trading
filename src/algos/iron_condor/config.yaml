# NIFTY weekly short iron condor — every tunable number lives here.
# Spec: docs/strategy-criteria/iron-condor.md (v2). Times are IST and must be quoted ("09:45").

algo_id: iron_condor
name: NIFTY Short Iron Condor
version: "0.3.0"
description: Sell OTM CE+PE, buy further-OTM hedges; every trading day of the weekly expiry cycle.
mode: paper            # live is disabled in v1
lots: 2                # 27 Oct 2026: 1 -> 2 (charges are mostly flat ₹20/order: ~₹195 vs ~₹192 per trade)

underlying: NIFTY
index_symbol: "NIFTY 50"
vix_symbol: "INDIA VIX"
strike_step: 50
trade_window_days: 5   # 28 Oct 2026: 3 -> 5 = every trading day (expiry day + the 4 before it, Wed-Tue)

# Gap between the two shorts, centred on ATM, keyed by trading days to expiry.
# 3-4 DTE (Wed, Thu) reuse the 2-DTE shape for now; widen them if the paper days say so.
width_by_dte: {0: 500, 1: 550, 2: 600, 3: 600, 4: 600}
# Distance from each short to its hedge.
hedge_by_dte: {0: 200, 1: 250, 2: 300, 3: 300, 4: 300}
subscribe_buffer_pts: 200   # extra strikes subscribed beyond the hedges, in case spot moves before entry

# Checked at entry time (no pre-open checks: the laptop is switched on at ~09:35).
filters:
  vix_max: 20                  # India VIX must be below this, else skip the day
  max_premium_ratio: 1.5       # CE vs PE at the short distance from spot: wait while dearer/cheaper > this
  pcr_range_pts: 1000          # PCR (put OI / call OI) over ATM ± this — logged only, never blocks

entry:
  max_spread_pts: 2.0          # wait while any leg's bid-ask is wider than this
  min_credit_pts: 10           # wait while the credit is below this (not worth the risk + charges)

exits:
  # Stop/target trigger on GROSS P&L (premium movement at bid/ask, before charges); net P&L after
  # charges is still logged in snapshots, live state and the daily summary.
  # With 1 lot, a net-of-charges ₹300 stop fires the moment the trade opens (~₹190 charges + spread).
  pnl_basis: gross             # gross | net (net = after entry charges + estimated exit charges)
  stop_loss_points: 5          # points of premium × lot size × lots (5 × 65 × 2 = ₹650)
  target_points: 8             # 8 × 65 × 2 = ₹1,040
  premium_blowout_mult: 1.35   # exit if cost to close >= 1.35 × entry credit
  short_leg_mult: 2.0          # ... or any short leg doubles
  stale_feed_seconds: 10

schedule:
  day_check: "08:15"           # past-due steps run as soon as the algo starts (~09:35)
  start_feed: "09:15"
  entry: "09:45"
  entry_deadline: "10:00"      # no entry by then = no trade today
  square_off: "15:15"
  report: "15:35"
