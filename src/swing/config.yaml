# Weekend support/resistance swing (stocks): every tunable number lives here.
# Spec: docs/strategy-criteria/weekend-sr-swing.md. Not a BaseAlgo: a weekly batch scan.

universe: swing              # config/universes/swing.yaml, written by `algo swing universe`
benchmark: NIFTY 50          # sectors' relative strength is measured against it (equity_daily key swing_benchmark)
history_days: 2920           # first download: about 8 years of daily candles
min_traded_value_cr: 25      # S5: 20-day average traded value, ₹ crore (liquid stocks only)
overview_near_atr: 1.0       # the overview's "near support/resistance": within 1 ATR of the zone
overview_stale_days: 7       # a stock whose last candle is older than this is left out (suspended)

zones:                       # spec section 4; ATR = simple 14-day average true range
  lookback_days: 730         # pivots and touches from the last two years
  min_history_days: 250      # fewer daily candles: no zones (recent listings)
  pivot_daily: 5             # Z1: extreme of 5 days either side ...
  pivot_weekly: 3            # ... or of 3 weeks either side; both count equally
  group_gap_atr: 0.5         # Z2: a gap this wide between pivot prices starts a new zone
  max_width_atr: 2.5         # ... and a zone wider than this is split at its widest gap
  min_width_atr: 0.5
  min_turns: 2               # a zone needs 2 pivots or 2 touches: a level price turned at more than once
  retest_atr: 1.0            # Z3: a touch = a visit that leaves the side it came from; the next
                             #     one from that side counts once price was 1 ATR away
  departure_days: 5          # Z5: move away over the next 5 days, in ATRs
  break_atr: 1.0             # Z9: 2 closes running more than 1 ATR beyond breaks the zone
  break_days: 2
  fresh_days: 60             # Z6: tests in the last 60 sessions are "recent"
  stale_tests: 4             # ... 4 recent tests scores 0 for freshness
  full_touches: 4            # Z3 full marks
  full_departure_atr: 3.0    # Z5 full marks
  confluence_pad_atr: 0.25   # Z8: 200-day average, round number, 52-week low/high this close
  weights: {touches: 1, reversal: 1, departure: 1, freshness: 1, volume: 1, confluence: 1}

setups:                      # spec section 5
  near_atr: 2.0              # S1: close within 2 ATR above a support's top (or inside it)
  min_score: 60              # S2
  min_rr: 2.0                # S3: (next resistance bottom - entry) / (entry - stop)
  stop_atr: 0.5              # stop = zone bottom - 0.5 ATR
  knife_atr: 2.0             # S4: no setup after a fall of more than 2 ATR ...
  knife_days: 3              # ... in 3 sessions
  fill_weeks: 4              # drop the setup if the entry isn't reached in 4 weeks
  max_hold_days: 120         # backtest: sell at the close after ~6 months
  amount_high: 15000         # ₹ per entry for score >= high_score
  amount_low: 7500           # ... below it
  high_score: 75
  cost_pct: 0.25             # round trip, delivery
  max_open: 8
  max_per_sector: 3          # per NSE industry

funnel:                      # the weekend workflow (dashboard Swing › Picks); Settings saves changes to
                             # data/swing/overrides.json, merged over this file
  sector_near_atr: 1.5       # stage 1: a sector index inside a zone, or within 1.5 ATR above a support ...
  sector_need_trend: true    # ... with its trend up (close above the 200-day average or weekly 50-EMA rising)
  require_sector: true       # stage 2 looks only at stocks of the sectors that pass
  rsi_days: 14
  stop_atr: 1.0              # stage 2: stop = zone bottom - 1 ATR (setups.stop_atr stays 0.5 for the backtest)
  default_mode: oco          # oco (stop + target) or target (target only)
  top_n: 10                  # stage 3: the best N, at most setups.max_per_sector per industry, fill Algo picks
  w_tech: 0.75               # score = weighted average of the parts there are (no fundamentals: tech + news)
  w_news: 0.10
  w_fund: 0.15
  news_days: 21              # results within 21 days of the scan: flagged, news score - 60
  results_penalty: 60
  macro_days: 7              # High-impact Indian macro events within 7 days: flagged, news score - 20
  macro_penalty: 20
  fund_rules:                # metric = a column key of the uploaded fundamentals CSV
    - {metric: roce, op: ">=", value: 15}
    - {metric: debt_to_equity, op: "<=", value: 1}
    - {metric: price_to_book_value, op: "<=", value: 5}

backtest:                    # W3 zone backtest (spec section 9): `algo swing backtest`
  move_atr: 1.0              # held = 1 ATR beyond the near edge before 1 ATR through the far edge
  horizon_days: 60           # unresolved after 60 sessions = open
  step_weeks: 1
  random_per_side: 2         # baseline: random bands per weekend, each side of the close
  random_max_atr: 3.0        # ... 0-3 ATR from the close
  seed: 7

# Sector and theme indices (spec section 2). ``name`` is Kite's tradingsymbol (NSE, INDICES);
# ``csv`` is the index's constituent file on niftyindices.com/IndexConstituent/.
# Not added (no constituent file found, 1 Nov 2026): NIFTY EV, NIFTY RAILWAYS PSU, NIFTY INTERNET,
# NIFTY NONCYC CONS, NIFTY NEW CONSUMP, NIFTY INFRALOG. Left out: NIFTY HOUSING, whose file is
# stale (it still lists HDFC and IBULHSGFIN and pre-2023 industry names); NIFTY CORE HOUSING covers it.
