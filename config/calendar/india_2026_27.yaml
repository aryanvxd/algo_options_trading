# Scheduled Indian macro events for the market calendar (and the algos' event checks).
# Kept by hand, like config/holidays/. Times are IST. Check each against its source when adding.
#
# Sources (checked 29 Oct 2026):
#   RBI MPC schedule 2026-27: https://www.rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=62422
#     (decision announced ~10:00 on the last day of each meeting)
#   MoSPI Advance Release Calendar 2026-27 (Sept 2026 update):
#     https://www.mospi.gov.in/uploads/documents/releaseCalender/1791356248513-ARC_2026_27_Sept_2026.pdf
#     ("In case of holidays, reports release on next working day": the loader moves weekend and
#      exchange-holiday dates to the next working day and keeps the planned date as `planned`.)
#     CPI, IIP and GDP releases are at 16:00 IST.
#   WPI (Office of the Economic Adviser, DPIIT): 14th of each month at 12:00 IST (next working day).
#
# impact: High | Medium | Low

defaults:
  country: IN

events:
  # ---- RBI monetary policy (decision day = last day of the meeting)
  - {date: 2026-12-04, time: "10:00", title: "RBI Monetary Policy Decision", impact: High, note: "MPC meeting Dec 2-4", source: rbi}
  - {date: 2027-02-05, time: "10:00", title: "RBI Monetary Policy Decision", impact: High, note: "MPC meeting Feb 3-5", source: rbi}

  # ---- CPI (inflation), 16:00
  - {date: 2026-11-12, time: "16:00", title: "CPI Inflation (Oct)", impact: High, source: mospi}
  - {date: 2026-12-12, time: "16:00", title: "CPI Inflation (Nov)", impact: High, source: mospi}
  - {date: 2027-01-12, time: "16:00", title: "CPI Inflation (Dec)", impact: High, source: mospi}
  - {date: 2027-02-12, time: "16:00", title: "CPI Inflation (Jan)", impact: High, source: mospi}
  - {date: 2027-03-12, time: "16:00", title: "CPI Inflation (Feb)", impact: High, source: mospi}

  # ---- GDP, 16:00
  - {date: 2026-11-30, time: "16:00", title: "GDP Q2 FY27 (Quarterly Estimates)", impact: High, source: mospi}
  - {date: 2027-01-07, time: "16:00", title: "GDP First Advance Estimates FY27", impact: High, source: mospi}
  - {date: 2027-02-26, time: "16:00", title: "GDP Q3 FY27 + Second Advance Estimates FY27", impact: High, source: mospi}

  # ---- IIP (industrial production), 16:00
  - {date: 2026-11-28, time: "16:00", title: "Industrial Production IIP (Oct)", impact: Medium, source: mospi}
  - {date: 2026-12-28, time: "16:00", title: "Industrial Production IIP (Nov)", impact: Medium, source: mospi}
  - {date: 2027-01-28, time: "16:00", title: "Industrial Production IIP (Dec)", impact: Medium, source: mospi}
  - {date: 2027-02-28, time: "16:00", title: "Industrial Production IIP (Jan)", impact: Medium, source: mospi}
  - {date: 2027-03-28, time: "16:00", title: "Industrial Production IIP (Feb)", impact: Medium, source: mospi}

  # ---- WPI (wholesale inflation), 12:00
  - {date: 2026-11-14, time: "12:00", title: "WPI Inflation (Oct)", impact: Medium, source: dpiit}
  - {date: 2026-12-14, time: "12:00", title: "WPI Inflation (Nov)", impact: Medium, source: dpiit}
  - {date: 2027-01-14, time: "12:00", title: "WPI Inflation (Dec)", impact: Medium, source: dpiit}
  - {date: 2027-02-14, time: "12:00", title: "WPI Inflation (Jan)", impact: Medium, source: dpiit}
  - {date: 2027-03-14, time: "12:00", title: "WPI Inflation (Feb)", impact: Medium, source: dpiit}

  # ---- Union Budget: by convention 1 February (11:00). Confirm when the Finance Ministry announces it.
  - {date: 2027-02-01, time: "11:00", title: "Union Budget 2027-28", impact: High, source: convention, note: "date to be confirmed"}
